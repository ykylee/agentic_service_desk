# 국면 전환 임계 선언 (WBS-4.8.1, FR-49 · NFR-8, §1.3.3 · O8).
#
# **전진 임계는 비어 있다.** 지어낸 것이 아니라 아직 정할 수 없는 것이다 —
# 국면은 "지식베이스가 무엇을 할 수 있는가"로 정의되었고(§1.3.3-a), 그 수준이
# 이 조직·이 규모에서 얼마인지는 실데이터가 말해 준다 (O8).
#
# 비어 있는 동안 시스템은 **전진을 제안하지 않는다.** 그것이 이 파일이 비어 있는
# 것의 뜻이다: 근거 없이 검수를 느슨하게 하느니 국면이 올라가지 않는 편이 낫다.
# 화면은 "조건 미달"이 아니라 "임계 미정"이라고 말한다 — 둘은 다른 상태다.
#
# 채울 때는 네 축을 **함께** 채운다. 하나라도 비면 판정하지 않는다: 세 축을 같이
# 보기로 한 것(§1.3.3-a)이 한 축만 보고 올라가는 오판을 막으려는 결정이었다.
#
# 다른 파일을 쓰려면 `ASD_PHASE_THRESHOLDS_PATH` 로 가리킨다. 그 파일이 이것을
# **덮는다** — 콘텐츠 타입 선언과 달리 더해지지 않는다: 임계는 목록이 아니라 값이다.

# 1국면 → 2국면 (콜드 스타트 → 축적)
#
# 묻는 것: 지식이 닿는 범위가 생겼는가, 그 답이 정확한가, 되풀이되는 물음이
# 보이기 시작했는가.
[advance.2]
# coverage            = 0.0   # 근거를 찾아 초안까지 간 비율의 **하한**
# explicit_resolution = 0.0   # 명시적 해결률의 **하한** (§6.3)
# rejection           = 0.0   # 검수 반려율의 **상한** — 이보다 높으면 올라가지 않는다
# repetition          = 0.0   # 반복 묶음에 속한 질문 비율의 **하한** (FAQ 재료)

# 2국면 → 3국면 (축적 → 성숙)
#
# 축이 하나 더 붙는다 (§1.3.3-b). 2국면은 에이전트 1차 검수 + 위험 신호 선별로
# 도는 구간이라 **같은 건에 대한 자동 판정과 사람 판정을 견줄 수 있고**, 3국면으로
# 넘어갈 자격은 그 일치율이 준다. 이것이 없으면 3국면 진입은 근거 없는 낙관이다.
[advance.3]
# coverage            = 0.0
# explicit_resolution = 0.0
# rejection           = 0.0
# repetition          = 0.0
# agreement           = 0.0   # 자동·사람 판정 일치율의 **하한** — 2→3 에만 붙는다

# 역행 임계 (§1.3.3-d).
#
# **여기에는 기본값이 있다.** 전진과 반대로 두는 이유가 둘이다.
#
#   ① 비워 두면 후퇴가 영영 일어나지 않는다. 그것은 안전한 쪽의 침묵이 아니라
#      "성숙했다고 착각한 채 자동화한다"(§0)는 실패 방식 그대로다.
#   ② 이 값들은 **절대 수준이 아니라 변화폭**이다. "근거 확보율이 얼마여야
#      2국면인가"는 국면마다 다르지만, "지난 기준선보다 20%p 떨어졌다"는 국면과
#      무관하게 이상 신호다.
#
# 그래도 20%p 는 실데이터로 다시 볼 값이다 (O8 과 함께). 다만 그때까지 0 이 아니라
# 이 값으로 돈다.
[regression]
coverage_drop  = 0.2   # 근거 확보율 급락 — 새 영역이 추가되었는가
stale_rise     = 0.2   # stale 비율 급등 — 대규모 코드 변경이 있었는가
novelty_rise   = 0.2   # 신규 유형 질문 급등 — 이용자 구성이 바뀌었는가 (2,000 → 7,000명)
rejection_rise = 0.2   # 검수 반려율 급등 — 지식이 낡았거나 질문 성격이 달라졌는가
# 기준선이 이만큼은 묵어야 견준다. 어제와 오늘을 견주면 잡음이 신호가 된다.
lookback_days  = 14
