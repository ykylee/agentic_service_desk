{% extends "base.html" %}
{% block title %}로그인{% endblock %}
{% block body %}
<h1>로그인</h1>
<p class="dim small">
  이 화면은 승인 · 게재 · 모순 해결 · 국면 전진을 실행한다. 운영자용이며,
  최종 이용자 인증은 모 시스템의 몫이다.
</p>
{% if error %}<p class="warn">{{ error }}</p>{% endif %}
<form method="post" action="/login" style="display:block; margin-top:1rem;">
  <input type="hidden" name="next" value="{{ next }}">
  <label class="small dim" for="password">암호</label><br>
  <input id="password" name="password" type="password" autofocus
         style="font:inherit; padding:.35rem .5rem; border:1px solid var(--line);
                border-radius:4px; background:transparent; color:inherit; width:16rem;"><br><br>
  <button type="submit">들어간다</button>
</form>
{% endblock %}
