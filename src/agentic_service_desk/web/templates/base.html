<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}운영자 대시보드{% endblock %} — Agentic Service Desk</title>
  <style>
    :root { --line:#d8dbe0; --dim:#5f6672; --warn:#a8410f; --ok:#1f6f43; --bg:#fff; --fg:#1a1d23; }
    @media (prefers-color-scheme: dark) {
      :root { --line:#333a44; --dim:#9aa3b0; --warn:#e8915c; --ok:#67c896; --bg:#14171c; --fg:#e6e9ee; }
    }
    * { box-sizing: border-box; }
    body { max-width: 62rem; margin: 0 auto; padding: 1.5rem 1rem 4rem;
           font: 15px/1.65 -apple-system, "Helvetica Neue", sans-serif;
           background: var(--bg); color: var(--fg); }
    a { color: inherit; }
    h1 { font-size: 1.25rem; margin: 0 0 .25rem; }
    h2 { font-size: 1rem; margin: 2rem 0 .5rem; }
    .dim { color: var(--dim); }
    .small { font-size: .85rem; }
    nav { border-bottom: 1px solid var(--line); padding-bottom: .75rem; margin-bottom: 1.25rem; }
    nav a { margin-right: 1rem; text-decoration: none; }
    table { border-collapse: collapse; width: 100%; }
    th, td { text-align: left; padding: .4rem .6rem .4rem 0; border-bottom: 1px solid var(--line);
             vertical-align: top; }
    th { font-weight: 600; color: var(--dim); font-size: .85rem; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(9rem, 1fr)); gap: .75rem; }
    .card { border: 1px solid var(--line); border-radius: 6px; padding: .7rem .85rem; }
    .card .n { font-size: 1.5rem; font-weight: 600; }
    .warn { color: var(--warn); }
    .ok { color: var(--ok); }
    .sides { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    @media (max-width: 40rem) { .sides { grid-template-columns: 1fr; } }
    .side { border: 1px solid var(--line); border-radius: 6px; padding: .75rem; }
    .side h4 { margin: 0 0 .4rem; font-size: .85rem; color: var(--dim); }
    code { background: rgba(127,127,127,.14); padding: .1rem .3rem; border-radius: 3px; }
    button { font: inherit; padding: .3rem .7rem; border: 1px solid var(--line);
             border-radius: 4px; background: transparent; color: inherit; cursor: pointer; }
    form { display: inline; }
  </style>
</head>
<body>
<nav>
  <a href="/"><strong>Agentic Service Desk</strong></a>
  {% for q in queues %}<a href="/queues/{{ q.id }}">{{ q.id }} {{ q.title }}</a>{% endfor %}
  <a href="/entry">＋ 질문 등록</a>
  <span class="dim small">단계 {{ stage }}</span>
</nav>
{% block body %}{% endblock %}
</body>
</html>
